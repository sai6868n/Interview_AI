<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InterviewAI — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <!-- Background -->
  <div class="bg-noise"></div>

  <!-- ── Top nav ── -->
  <header class="top-bar">
    <a href="index.html" class="wordmark">
      <svg width="22" height="22" viewBox="0 0 32 32" fill="none">
        <rect width="32" height="32" rx="8" fill="#00e0ff" fill-opacity=".15"/>
        <path d="M9 16 L12 12 L16 20 L20 10 L23 16" stroke="#00e0ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="word-interview">Interview</span><span class="word-ai">AI</span>
    </a>
  </header>

  <!-- ── Main card ── -->
  <main class="auth-wrap">
    <div class="auth-card" id="authCard">

      <!-- ══════════════════════════
           VIEW: Login
      ══════════════════════════ -->
      <div class="view" id="viewLogin">
        <h1 class="card-title">Welcome back</h1>
        <p class="card-sub">Sign in to your account</p>

        <div class="social-row">
          <button class="social-btn" id="googleLoginBtn">
            <svg width="18" height="18" viewBox="0 0 24 24">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Continue with Google
          </button>
          <button class="social-btn" id="githubLoginBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
            </svg>
            Continue with GitHub
          </button>
        </div>

        <div class="divider"><span>OR</span></div>

        <form id="loginForm" novalidate>
          <div class="field-group">
            <label class="field-label" for="loginEmail">Email address</label>
            <input type="email" id="loginEmail" class="field-input" placeholder="you@example.com" autocomplete="email" />
            <span class="field-error" id="loginEmailErr"></span>
          </div>
          <div class="field-group">
            <div class="label-row">
              <label class="field-label" for="loginPassword">Password</label>
              <a href="#" class="forgot-link" id="forgotBtn">Forgot password?</a>
            </div>
            <div class="input-pw-wrap">
              <input type="password" id="loginPassword" class="field-input" placeholder="••••••••" autocomplete="current-password" />
              <button type="button" class="eye-btn" id="loginEye" tabindex="-1">
                <svg id="eyeIconLogin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <span class="field-error" id="loginPasswordErr"></span>
          </div>
          <button type="submit" class="primary-btn" id="loginSubmitBtn">
            <span class="btn-label">Sign in</span>
            <svg class="btn-spinner hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
          </button>
        </form>

        <p class="switch-text">Don't have an account? <a href="#" class="switch-link" data-to="viewSignup">Sign up</a></p>
      </div>

      <!-- ══════════════════════════
           VIEW: Signup
      ══════════════════════════ -->
      <div class="view hidden" id="viewSignup">
        <h1 class="card-title">Create account</h1>
        <p class="card-sub">Start your AI interview coaching journey</p>

        <div class="social-row">
          <button class="social-btn" id="googleSignupBtn">
            <svg width="18" height="18" viewBox="0 0 24 24">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Continue with Google
          </button>
          <button class="social-btn" id="githubSignupBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
            </svg>
            Continue with GitHub
          </button>
        </div>

        <div class="divider"><span>OR</span></div>

        <form id="signupForm" novalidate>
          <div class="field-group">
            <label class="field-label" for="signupName">Full name</label>
            <input type="text" id="signupName" class="field-input" placeholder="Alex Johnson" autocomplete="name" />
            <span class="field-error" id="signupNameErr"></span>
          </div>
          <div class="field-group">
            <label class="field-label" for="signupEmail">Email address</label>
            <input type="email" id="signupEmail" class="field-input" placeholder="you@example.com" autocomplete="email" />
            <span class="field-error" id="signupEmailErr"></span>
          </div>
          <div class="field-group">
            <label class="field-label" for="signupPassword">Password</label>
            <div class="input-pw-wrap">
              <input type="password" id="signupPassword" class="field-input" placeholder="Minimum 8 characters" autocomplete="new-password" />
              <button type="button" class="eye-btn" id="signupEye" tabindex="-1">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <div class="strength-track">
              <div class="strength-fill" id="strengthFill"></div>
            </div>
            <span class="field-error" id="signupPasswordErr"></span>
          </div>
          <div class="field-group">
            <label class="field-label" for="signupConfirm">Confirm password</label>
            <input type="password" id="signupConfirm" class="field-input" placeholder="••••••••" autocomplete="new-password" />
            <span class="field-error" id="signupConfirmErr"></span>
          </div>

          <label class="terms-check">
            <input type="checkbox" id="agreeTerms" />
            <span class="checkmark"></span>
            <span>I agree to the <a href="#" class="inline-link">Terms of Service</a> and <a href="#" class="inline-link">Privacy Policy</a></span>
          </label>
          <span class="field-error" id="signupTermsErr"></span>

          <button type="submit" class="primary-btn" id="signupSubmitBtn">
            <span class="btn-label">Create account</span>
            <svg class="btn-spinner hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
          </button>
        </form>

        <p class="switch-text">Already have an account? <a href="#" class="switch-link" data-to="viewLogin">Sign in</a></p>
      </div>

      <!-- ══════════════════════════
           VIEW: Forgot password
      ══════════════════════════ -->
      <div class="view hidden" id="viewForgot">
        <button class="back-btn" data-to="viewLogin">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
          Back
        </button>
        <h1 class="card-title">Reset password</h1>
        <p class="card-sub">We'll send a reset link to your email address</p>
        <form id="forgotForm" novalidate>
          <div class="field-group">
            <label class="field-label" for="forgotEmail">Email address</label>
            <input type="email" id="forgotEmail" class="field-input" placeholder="you@example.com" autocomplete="email" />
            <span class="field-error" id="forgotEmailErr"></span>
          </div>
          <button type="submit" class="primary-btn" id="forgotSubmitBtn">
            <span class="btn-label">Send reset link</span>
            <svg class="btn-spinner hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
          </button>
        </form>
      </div>

    </div><!-- /auth-card -->
  </main>

  <!-- Toast -->
  <div class="toast" id="toast">
    <span class="toast-icon" id="toastIcon"></span>
    <span id="toastMsg"></span>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
